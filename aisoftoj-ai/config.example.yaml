# LangSmith tracing credentials and sampling settings are environment-only.
# Do not add LANGSMITH_API_KEY or other observability secrets to this YAML file.

database_url: mysql+asyncmy://aisoftoj_ai:change-me@127.0.0.1:3306/aisoftoj

platform_base_url: http://127.0.0.1:8080
platform_service_key: change-me
platform_connect_timeout_seconds: 2
platform_read_timeout_seconds: 5
platform_max_response_bytes: 2097152

# 启用前先在 Java 业务库登记经过确认的官方/授权教材地址和章节页码。
textbook_rag_enabled: false
qdrant_url: http://127.0.0.1:6333
qdrant_api_key:
qdrant_collection: aisoftoj_textbook_chunks
textbook_allowed_hosts: []
textbook_download_timeout_seconds: 30
textbook_download_max_bytes: 104857600
textbook_download_max_redirects: 3
textbook_embedding_base_url: https://api.openai.com/v1
textbook_embedding_api_key:
textbook_embedding_model: text-embedding-3-small
textbook_embedding_dimensions: 1536
textbook_embedding_batch_size: 32
textbook_chunk_target_chars: 900
textbook_chunk_overlap_chars: 120
textbook_retrieval_candidates: 12
textbook_retrieval_sources: 3
textbook_retrieval_min_score: 0.55
textbook_retrieval_profile_version: textbook-rag-v1

llm_base_url: https://api.openai.com/v1
llm_endpoint_mode: openai_base
llm_api_key: change-me
llm_default_model: gpt-5-mini
llm_request_timeout_seconds: 60
llm_max_retries: 1

agent_max_run_tokens: 32000
agent_max_output_tokens: 2048
agent_quota_reservation_margin_percent: 10
agent_max_run_seconds: 180
agent_summary_trigger_tokens: 24000
agent_summary_keep_messages: 12
agent_max_concurrent_runs: 1
agent_max_user_concurrent_runs: 1
agent_max_user_message_chars: 20000
agent_loop_warn_repetitions: 3
agent_loop_hard_repetitions: 5
shutdown_drain_seconds: 15

skills_root: skills/public
skills_max_file_bytes: 262144
skills_max_count: 100
skills_max_index_chars: 12000
skills_max_resources_per_skill: 100
skills_max_total_resource_bytes: 2097152
skills_read_max_chars: 20000

host: 127.0.0.1
port: 8000
log_level: info
