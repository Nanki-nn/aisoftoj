server {
    listen 80;
    listen [::]:80;
    server_name aisoftoj.cn www.aisoftoj.cn;
    return 301 https://aisoftoj.cn$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.aisoftoj.cn;

    ssl_certificate /etc/letsencrypt/live/aisoftoj.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aisoftoj.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://aisoftoj.cn$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name aisoftoj.cn;

    ssl_certificate /etc/letsencrypt/live/aisoftoj.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aisoftoj.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 12m;

    location = /api {
        return 308 /api/;
    }

    # The trailing slash strips the public /api/ prefix before proxying.
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location = /uploads {
        return 308 /uploads/;
    }

    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:8080/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
