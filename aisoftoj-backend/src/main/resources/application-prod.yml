logging:
  level:
    com.nan.aisoftoj: warn

server:
  address: ${SERVER_ADDRESS:127.0.0.1}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  content-crypto:
    max-plaintext-bytes: ${CONTENT_CRYPTO_MAX_PLAINTEXT_BYTES:8388608}

auth:
  jwt:
    secret: ${AUTH_JWT_SECRET}
