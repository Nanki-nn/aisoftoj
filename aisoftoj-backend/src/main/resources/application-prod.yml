logging:
  level:
    com.nan.aisoftoj: warn

server:
  address: ${SERVER_ADDRESS:127.0.0.1}

spring:
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: ${FLYWAY_BASELINE_VERSION:4}
    validate-on-migrate: true
    locations: classpath:db/migration
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          connectiontimeout: ${MAIL_CONNECTION_TIMEOUT_MS:5000}
          timeout: ${MAIL_READ_TIMEOUT_MS:10000}
          writetimeout: ${MAIL_WRITE_TIMEOUT_MS:10000}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLE:true}
            required: ${MAIL_STARTTLS_REQUIRED:true}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  content-crypto:
    max-plaintext-bytes: ${CONTENT_CRYPTO_MAX_PLAINTEXT_BYTES:8388608}

auth:
  jwt:
    secret: ${AUTH_JWT_SECRET}
  email:
    code-secret: ${AUTH_EMAIL_CODE_SECRET}
    from: ${MAIL_FROM}
    from-name: ${MAIL_FROM_NAME:知构软考}
    worker-delay-ms: ${AUTH_EMAIL_WORKER_DELAY_MS:1000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
