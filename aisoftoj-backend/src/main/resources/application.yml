server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/aisoftoj?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: abc123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          connectiontimeout: ${MAIL_CONNECTION_TIMEOUT_MS:5000}
          timeout: ${MAIL_READ_TIMEOUT_MS:10000}
          writetimeout: ${MAIL_WRITE_TIMEOUT_MS:10000}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLE:true}
            required: ${MAIL_STARTTLS_REQUIRED:true}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.nan.aisoftoj.entity
  configuration:
    map-underscore-to-camel-case: true

# 文件上传配置
file:
  upload:
    path: ${FILE_UPLOAD_PATH:./uploads/}
    url-prefix: ${FILE_UPLOAD_URL_PREFIX:/uploads/}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173}
  content-crypto:
    max-plaintext-bytes: ${CONTENT_CRYPTO_MAX_PLAINTEXT_BYTES:8388608}

auth:
  jwt:
    secret: ${AUTH_JWT_SECRET:dev-change-me-before-prod}
    expire-hours: ${AUTH_JWT_EXPIRE_HOURS:168}
  email:
    code-secret: ${AUTH_EMAIL_CODE_SECRET:dev-email-code-secret-change-before-production}
    from: ${MAIL_FROM:}
    from-name: ${MAIL_FROM_NAME:知构软考}
    worker-delay-ms: ${AUTH_EMAIL_WORKER_DELAY_MS:1000}

logging:
  level:
    com.nan.aisoftoj: ${APP_LOG_LEVEL:info}

claude:
  api-key: ${CLAUDE_API_KEY:}
  model: claude-sonnet-4-6

# 阿里云 OSS 配置
aliyun:
  oss:
    endpoint: ${OSS_ENDPOINT:}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    bucket-name: ${OSS_BUCKET_NAME:}
    # 文件访问域名，如 https://your-bucket.oss-cn-hangzhou.aliyuncs.com 或自定义域名
    base-url: ${OSS_BASE_URL:}
    # 上传目录前缀
    dir-prefix: ${OSS_DIR_PREFIX:aisoftoj/}
